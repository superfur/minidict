name: Release

# 打 v* tag 时自动发布到 npm。流程：lint/格式/类型/test/build → 校验 tag 与版本一致 → npm publish。
# 认证方式是 npm Trusted Publishing（OIDC），需要先在 npmjs.com 的包设置里登记本仓库与本文件名。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      - name: Verify tag matches package.json
        run: |
          PKG=$(node -p "require('./package.js
          TAG=${GITHUB_REF_NAME#v}
          echo "package.json=$PKG tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag ($TAG) 与 packa"
            exit 1
          fi

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish to npm
        run: npm publish --provenance --access
