name: Release

# 打 v* tag 时自动发布到 npm。流程：lint/格式/类型/test/build → 校验 tag 与版本一致 → npm publish。
# 认证方式是 npm Trusted Publishing（OIDC），需要先在 npmjs.com 的包设置里登记本仓库与本文件名。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # Trusted Publishing（OIDC）需要

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      - name: Verify tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          echo "package.json=$PKG tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag ($TAG) 与 package.json 版本 ($PKG) 不一致"
            exit 1
          fi

      # Trusted Publishing 需要 npm >= 11.5.1；不设 registry-url，避免 setup-node 写入
      # 要求 NODE_AUTH_TOKEN 的 .npmrc，让 npm 直接走 OIDC 认证。
      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install -g npm@latest

      # 通过 OIDC（Trusted Publishing）认证，不需要 NPM_TOKEN；provenance 会自动生成。
      - name: Publish to npm
        run: npm publish --access public
